body:
  text: 五總志雜家類三雜説之屬提要臣等謹案五總志一卷宋吳坰撰坰仕履未詳前有自序題建炎庚戌避地無諸城書于蕭寺之道山亭書中有與蘇叔黨自太原至河外事又有靖康丙午于京兆祥符寓舍被掠事蓋自汴京從髙宗南渡者而第一條內載其大父事仁宗為御史嘗言大臣未報復上章乞斬姦臣以謝天下上大書鐵御史三字賜之又一條稱嘉州嵗貢荔枝紅桑等物大父為犍為令作三戒詩見意九重稱奬又載其父嘗居李邦直幕府及崇寧乙酉責居荆南諸事則亦元祐黨人之子孫而史籍闕略其名已不可復考矣其書皆紀所聞見雜事間及考證舊説取龜生五總靈而知事之語名之曰五總志中間極推重黃庭堅以為于詩人有開闢之功蓋亦服膺江西流派者其引述故事得失互見如謂千字文敕員外製敕字當作梁當時帝王命令尚未稱敕又謂碧落碑有綘澤二通此類皆有考據至云漢髙據厠見大將軍不冠不見丞相以漢武帝待汲黯事誤作髙祖則疏舛亦未能免又他書皆稱駱賔王從徐敬業起兵事敗為僧靈隱寺為宋之問續桂子天香之句其説本舛駁不合而此書乃云賔王未顯時傭作杭州梵天寺一老僧苦吟不已賔王為足成之與他書所載稍為近理特不知其何據至于北宋瑣事紀録綦詳頗有足資參證者説郛載此書僅摘録數條此本與永樂大典所收者檢勘相合蓋猶相傳之原本也乾隆四十四年正月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀五總志原序余雖蒙鄙固陋少從父師之訓於讀書業文不敢自棄昔嘗有意於著書立言以見于後世而憂患餘生艱棘百為方時搶攘顧逃生之不暇猶廢井不汲泥不食矣然於紬繹方册與夫耳目所聞見有可紀述者尚未可結舌閣筆於是因事輒書雜以己語或以古證今亦不復列其次第非敢為書覬有補于遺忘龜生五總靈而知事古人譬諸老于學而不斁者心竊慕之因志其首曰五總且將求當世之能文章者丐敘以紀之庶幾託斯文以增重也建炎庚戌上已前一日避地無諸城書於蕭寺之道山亭
